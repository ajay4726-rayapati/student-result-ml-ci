
name: Student Result ML CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run API tests
        run: pytest -q

      - name: Upload trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-ml-artifacts
          path: |
            student_result_model.pkl
            metrics.json
          if-no-files-found: error

  docker-build-test:
    runs-on: ubuntu-latest
    needs: train-test-deliver

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download validated release candidate
        uses: actions/download-artifact@v4
        with:
          name: validated-ml-artifacts
          path: .

      - name: Build Docker image
        run: docker build -f Dockerfile -t student-result-ml:1.0 .

      - name: Start container
        run: |
          docker run -d --name student-result-api -p 5000:5000 student-result-ml:1.0

      - name: Test health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-api
          exit 1

      - name: Show container logs
        if: always()
        run: docker logs student-result-api || true

      - name: Stop container
        if: always()
        run: docker rm -f student-result-api || true
