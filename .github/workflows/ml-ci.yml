name: Student Result ML CI-CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train-test-deliver:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated ML tests
        run: python -m unittest test_ml_pipeline.py -v

      - name: Run prediction application tests
        run: python -m unittest test_app.py -v

      - name: Prepare release candidate
        run: |
          mkdir -p release_candidate
          cp app.py release_candidate/
          cp student_result_model.pkl release_candidate/
          cp metrics.json release_candidate/
          cp requirements.txt release_candidate/
          printf 'Student Result Prediction ML Application\nRun: python app.py\nEndpoint: POST /predict\n' > release_candidate/DEPLOYMENT.txt

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate/
          if-no-files-found: error
          retention-days: 7

  docker-build-test:
    runs-on: ubuntu-latest
    needs: train-test-deliver

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Download validated release candidate
        uses: actions/download-artifact@v4
        with:
          name: student-result-ml-release
          path: release_candidate

      - name: Build Docker image
        run: |
          docker build -t student-result-ml:1.0 release_candidate

      - name: Start container
        run: |
          docker run -d --name student-result-container \
            -p 5000:5000 student-result-ml:1.0

      - name: Test health endpoint
        run: |
          for i in $(seq 1 15); do
            if curl --fail http://localhost:5000/; then
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-container
          exit 1

      - name: Save Docker image
        run: |
          docker save student-result-ml:1.0 -o student-result-ml.tar

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@v4
        with:
          name: student-result-docker-image
          path: student-result-ml.tar
          retention-days: 7

      - name: Show container logs
        if: always()
        run: docker logs student-result-container || true
